<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipFrame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f5f5f3;
    --surface: #ffffff;
    --ink: #18191b;
    --muted: #6e7075;
    --line: #e2e2df;
    --stamp: #f2c200;
    --stamp-ink: #18191b;
    --focus: #b38f00;
    --error: #b42318;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121314;
      --surface: #1a1b1d;
      --ink: #ededeb;
      --muted: #8e9096;
      --line: #2a2c2f;
      --focus: #f2c200;
      --error: #f97066;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121314;
    --surface: #1a1b1d;
    --ink: #ededeb;
    --muted: #8e9096;
    --line: #2a2c2f;
    --focus: #f2c200;
    --error: #f97066;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.55 var(--sans);
    padding-inline: 20px;
    padding-block: 48px 96px;
  }
  main { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
  main > *, #result > * { min-width: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: baseline; gap: 10px; }
  .mark { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .tag { color: var(--muted); font-size: 14px; }

  form { display: grid; gap: 12px; }
  .row { display: flex; gap: 8px; }
  .drop {
    display: grid; place-items: center; gap: 4px; text-align: center;
    background: var(--surface); border: 1px dashed var(--line); border-radius: 10px;
    padding: 28px 16px; cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--muted); }
  .drop:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .drop strong { font-weight: 500; }
  .drop span { color: var(--muted); font-size: 14px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .bar-track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--ink); transition: width 0.2s; }
  #player { width: 100%; max-height: 420px; background: #000; border-radius: 8px; display: block; }
  .primary {
    background: var(--ink); color: var(--ground); border: 0; border-radius: 8px;
    padding: 0 20px; font-weight: 500; cursor: pointer;
  }
  .primary:disabled { opacity: 0.45; cursor: default; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; width: fit-content; }
  .check input { accent-color: var(--ink); margin: 0; }

  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }

  #samples ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #samples li { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  #samples .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #samples li button {
    flex-shrink: 0; background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 12px; font-size: 14px; cursor: pointer;
  }
  #samples li button:hover { border-color: var(--muted); }
  #samples li button.done { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #recent ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #recent li button {
    width: 100%; display: flex; justify-content: space-between; gap: 16px;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 10px 2px; text-align: left; cursor: pointer;
  }
  #recent li button:hover .title { text-decoration: underline; text-underline-offset: 3px; }
  #recent .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  #progress { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  #progress li:last-child { color: var(--ink); }
  #progress li.running:last-child::after { content: "…"; }
  .error { color: var(--error); font-size: 14px; margin: 0; }

  #result { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .head { display: grid; gap: 4px; }
  .head h1 { font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; }
  .meta a, .link { color: var(--muted); text-underline-offset: 3px; }
  .link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-size: 14px; }
  .link:hover, .meta a:hover { color: var(--ink); }

  .strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
  .strip button {
    position: relative; flex: 0 0 auto; width: 144px; aspect-ratio: 16 / 9; max-width: 100%;
    padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    background: #000; cursor: pointer; scroll-snap-align: start;
  }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stamp {
    position: absolute; top: 4px; left: 4px;
    background: var(--stamp); color: var(--stamp-ink);
    font: 500 11px/1 var(--mono); padding: 3px 4px; border-radius: 2px;
    font-variant-numeric: tabular-nums;
  }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; background: var(--line); padding: 2px; border-radius: 7px; }
  .tabs button { background: none; border: 0; padding: 4px 12px; border-radius: 5px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

  #entries { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #entries li { display: grid; grid-template-columns: 52px 64px minmax(0, 1fr); gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); scroll-margin-top: 24px; }
  #entries li.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--stamp) 28%, transparent); } to { background: transparent; } }
  #entries button.time { background: none; border: 0; padding: 1px 0 0; text-align: left; cursor: pointer; align-self: start; }
  #entries button.time:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 3px; }
  .speech .body { color: var(--muted); }
  .code { font-family: var(--mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .empty { color: var(--muted); font-size: 14px; }

  #chat { display: grid; gap: 12px; }
  #messages { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  #messages:empty { display: none; }
  .msg-user { font-weight: 500; }
  .msg-model { overflow-wrap: anywhere; display: grid; gap: 8px; }
  .msg-model p { margin: 0; }
  .msg-model .md-h { font-weight: 600; }
  .msg-model ul.md { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .msg-model li.lvl2 { margin-left: 20px; list-style-type: circle; }
  .msg-model .dash { color: var(--muted); padding: 0 2px; }
  .msg-model.pending::after { content: "…"; color: var(--muted); line-height: 1; }
  .msg-model code { font-family: var(--mono); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .ts {
    background: var(--stamp); color: var(--stamp-ink); border: 0; border-radius: 3px;
    font: 500 12px/1.4 var(--mono); padding: 0 4px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; }
  .suggest button {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  .suggest button:hover { color: var(--ink); border-color: var(--muted); }
  #ask-input {
    flex: 1; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 14px;
  }
  #ask-input::placeholder { color: var(--muted); }

  @media (max-width: 520px) {
    body { padding-block: 28px 64px; }
    .row { flex-direction: column; }
    .primary { padding: 11px 20px; }
    #entries li { grid-template-columns: 48px minmax(0, 1fr); }
    .kind { grid-column: 2; grid-row: 1; padding-top: 2px; }
    #entries li .body { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #entries li.flash { animation: none; background: color-mix(in srgb, var(--stamp) 20%, transparent); }
  }
</style>
</head>
<body>
<main>
  <header>
    <a class="mark" href="/" style="color:inherit;text-decoration:none">FlipFrame</a>
    <span class="tag">watch a video as text</span>
    <a class="tag" href="/share" style="margin-left:auto">Share to Claude or ChatGPT →</a>
  </header>

  <form id="form">
    <label class="drop" id="drop">
      <input id="file" type="file" accept="video/*,.mkv,.mov,.webm,.avi">
      <strong>Drop a video file here, or click to choose one</strong>
      <span>MP4, MOV, MKV, WebM</span>
    </label>
    <label class="check"><input id="coding" type="checkbox"> Code or small text on screen (sharper, slower)</label>
  </form>

  <section id="status" hidden>
    <div class="bar-track" id="upload-bar" hidden><div class="bar-fill" id="upload-fill"></div></div>
    <ul id="progress" style="margin-top:10px"></ul>
    <p id="error" class="error" hidden></p>
  </section>

  <section id="samples" hidden>
    <p class="label">Test videos</p>
    <ul></ul>
  </section>

  <section id="recent" hidden>
    <p class="label">Watched</p>
    <ul></ul>
  </section>

  <section id="result" hidden>
    <video id="player" controls preload="metadata" hidden></video>
    <div class="head">
      <h1 id="title"></h1>
      <div class="meta">
        <span id="length"></span>
        <button id="copy" class="link" type="button">Copy timeline</button>
        <button id="rewatch" class="link" type="button">Watch again</button>
      </div>
    </div>

    <div>
      <p class="label" id="frames-label">Frames</p>
      <div id="strip" class="strip"></div>
    </div>

    <div id="chat">
      <p class="label" style="margin:0">Ask about this video</p>
      <ul id="messages" aria-live="polite"></ul>
      <div class="suggest" id="suggest">
        <button type="button">Summarize this video</button>
        <button type="button">What code is written?</button>
        <button type="button">What are the key moments?</button>
      </div>
      <form id="ask" class="row">
        <input id="ask-input" type="text" required autocomplete="off" placeholder="Ask a question, or mention a time like 4:12" aria-label="Question">
        <button id="ask-go" class="primary" type="submit">Ask</button>
      </form>
    </div>

    <div>
      <div class="bar">
        <p class="label" style="margin:0">Timeline</p>
        <div class="tabs" role="group" aria-label="Show">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="screen" aria-pressed="false">On screen</button>
          <button type="button" data-filter="speech" aria-pressed="false">Speech</button>
        </div>
      </div>
      <ul id="entries" style="margin-top:10px"></ul>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const stamp = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { SPEECH: "Speech", SCREEN: "Screen", TEXT: "Text", ACTION: "Action" };

let current = null;
let filter = "all";

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}

async function loadSamples() {
  const list = await api("/api/samples").catch(() => []);
  const mb = (n) => `${(n / 1048576).toFixed(n < 10485760 ? 1 : 0)} MB`;
  $("samples").querySelector("ul").innerHTML = list.map((v) => `<li>
      <span class="title" title="${esc(v.name)}">${esc(v.name)}</span>
      <span class="time">${mb(v.size)}</span>
      ${v.video
        ? `<button type="button" class="done" data-open="${esc(v.video)}">Open</button>`
        : `<button type="button" data-sample="${esc(v.name)}">Process</button>`}
    </li>`).join("");
  $("samples").hidden = !list.length || !!current;
}

$("samples").addEventListener("click", async (e) => {
  const open = e.target.closest("button[data-open]");
  if (open) return show(open.dataset.open);
  const b = e.target.closest("button[data-sample]");
  if (!b || $("file").disabled) return;
  busy(true);
  resetView();
  $("progress").innerHTML = `<li class="running">starting ${esc(b.dataset.sample)}</li>`;
  try {
    const { job } = await api("/api/samples", { name: b.dataset.sample, coding: $("coding").checked });
    await follow(job);
  } catch (err) {
    fail(err);
  } finally {
    busy(false);
  }
});

async function loadRecent() {
  const list = await api("/api/videos").catch(() => []);
  const ul = $("recent").querySelector("ul");
  ul.innerHTML = list.map((v) =>
    `<li><button type="button" data-id="${esc(v.id)}"><span class="title">${esc(v.title)}</span><span class="time">${stamp(v.duration)}</span></button></li>`
  ).join("");
  $("recent").hidden = !list.length || !!current;
}

$("recent").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]");
  if (b) show(b.dataset.id);
});

function busy(on) {
  $("file").disabled = on;
  $("drop").style.opacity = on ? 0.5 : 1;
}

async function follow(job) {
  while (true) {
    const j = await api(`/api/jobs/${job}`);
    $("progress").innerHTML = j.log.map((l) => `<li class="${j.status === "running" ? "running" : ""}">${esc(l)}</li>`).join("");
    if (j.status === "done") { $("status").hidden = true; await show(j.video); return; }
    if (j.status === "error") throw new Error(j.error);
    await new Promise((r) => setTimeout(r, 700));
  }
}

function resetView() {
  $("player").pause();
  $("result").hidden = true;
  $("recent").hidden = true;
  $("samples").hidden = true;
  $("error").hidden = true;
  $("status").hidden = false;
  $("progress").innerHTML = "";
  current = null;
}

function fail(err) {
  $("upload-bar").hidden = true;
  $("error").textContent = `Couldn't process this video: ${err.message}`;
  $("error").hidden = false;
  loadRecent();
  loadSamples();
}

function uploadFile(file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const q = new URLSearchParams({ name: file.name, coding: $("coding").checked });
    xhr.open("POST", `/api/upload?${q}`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) $("upload-fill").style.width = `${(e.loaded / e.total) * 100}%`;
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch {}
      xhr.status < 300 ? resolve(data) : reject(new Error(data.detail || `Upload failed (${xhr.status})`));
    };
    xhr.onerror = () => reject(new Error("Upload failed. Is the FlipFrame server still running?"));
    xhr.send(file);
  });
}

async function process(file) {
  if (!file) return;
  busy(true);
  resetView();
  $("upload-bar").hidden = false;
  $("upload-fill").style.width = "0";
  $("progress").innerHTML = `<li class="running">uploading ${esc(file.name)}</li>`;
  try {
    const { job } = await uploadFile(file);
    $("upload-bar").hidden = true;
    await follow(job);
  } catch (err) {
    fail(err);
  } finally {
    busy(false);
    $("file").value = "";
  }
}

$("file").addEventListener("change", () => process($("file").files[0]));
$("drop").addEventListener("dragover", (e) => { e.preventDefault(); $("drop").classList.add("over"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", (e) => {
  e.preventDefault();
  $("drop").classList.remove("over");
  if (!$("file").disabled) process(e.dataTransfer.files[0]);
});

$("rewatch").addEventListener("click", async () => {
  if (!current) return;
  const id = current.id;
  busy(true);
  resetView();
  try {
    const { job } = await api("/api/watch", { video: id, coding: $("coding").checked });
    await follow(job);
  } catch (err) {
    fail(err);
  } finally {
    busy(false);
  }
});

function seek(t) {
  const p = $("player");
  if (p.hidden) return;
  p.currentTime = t;
  p.play().catch(() => {});
}

async function show(id) {
  const data = await api(`/api/videos/${encodeURIComponent(id)}`);
  current = data;
  history.replaceState(null, "", `#v=${data.id}`);

  $("title").textContent = data.title;
  $("length").textContent = `${Math.floor(data.duration / 60)} min ${data.duration % 60} s`;
  $("player").hidden = !data.playable;
  if (data.playable) $("player").src = `/media/${encodeURIComponent(data.id)}`;
  $("frames-label").textContent = `${data.frames.length} frames kept`;
  $("strip").innerHTML = data.frames.map((s) =>
    `<button type="button" data-t="${s}" aria-label="Jump to ${stamp(s)}"><img loading="lazy" alt="" src="/frames/${esc(data.id)}/${String(s).padStart(5, "0")}.jpg"><span class="stamp">${stamp(s)}</span></button>`
  ).join("");

  $("status").hidden = true;
  $("recent").hidden = true;
  $("samples").hidden = true;
  $("result").hidden = false;
  render();
  renderChat();
}

function render() {
  const items = current.entries.filter((e) =>
    filter === "all" || (filter === "speech" ? e.kind === "SPEECH" : e.kind !== "SPEECH"));
  $("entries").innerHTML = items.length ? items.map((e) => {
    const body = e.kind === "TEXT"
      ? `<pre class="code">${esc(e.text.split(/\s*⏎\s*/).join("\n"))}</pre>`
      : esc(e.text);
    return `<li class="${e.kind.toLowerCase()}" data-t="${e.t}">
      <button type="button" class="time" data-seek="${e.t}" title="Play from ${stamp(e.t)}">${stamp(e.t)}</button>
      <span class="kind">${KIND[e.kind] || e.kind}</span>
      <div class="body">${body}</div></li>`;
  }).join("") : `<li><span></span><span></span><span class="empty">Nothing here. If there are no screen notes, check that GEMINI_API_KEY is set in .env.</span></li>`;
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-filter]");
  if (!b) return;
  filter = b.dataset.filter;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

function jump(t) {
  const rows = [...$("entries").children].filter((li) => li.dataset.t !== undefined);
  const row = rows.find((li) => Number(li.dataset.t) >= t) || rows[rows.length - 1];
  if (!row) return;
  row.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
}

$("strip").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-t]");
  if (b) { jump(Number(b.dataset.t)); seek(Number(b.dataset.t)); }
});

$("entries").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-seek]");
  if (b) { seek(Number(b.dataset.seek)); $("player").scrollIntoView({ block: "nearest" }); }
});

// Chat
const chats = {};
const storeKey = (id) => `flipframe-chat-${id}`;

function loadChat(id) {
  if (!chats[id]) {
    try { chats[id] = JSON.parse(localStorage.getItem(storeKey(id))) || []; } catch { chats[id] = []; }
  }
  return chats[id];
}

function saveChat(id) {
  try { localStorage.setItem(storeKey(id), JSON.stringify(chats[id].slice(-40))); } catch {}
}

function chip(t) {
  const [m, sec] = t.split(":");
  return `<button type="button" class="ts" data-t="${Number(m) * 60 + Number(sec)}">${m.padStart(2, "0")}:${sec}</button>`;
}

// Inline markdown on already-escaped text: code, bold, italic, [MM:SS] and [MM:SS–MM:SS].
function inline(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])[*_]([^*_\n]+)[*_](?![*\w])/g, "$1<em>$2</em>")
    .replace(/\[(\d{1,2}:[0-5]\d)(?:\s*[–—-]\s*(\d{1,2}:[0-5]\d))?\]/g,
      (_, a, b) => b ? `${chip(a)}<span class="dash">–</span>${chip(b)}` : chip(a));
}

// Small markdown renderer: paragraphs, headings, and bullet or numbered lists (two indent levels).
function formatAnswer(text) {
  let html = "", para = [], inList = false;
  const flush = () => { if (para.length) { html += `<p>${inline(esc(para.join(" ")))}</p>`; para = []; } };
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    const item = raw.match(/^(\s*)(?:[*\-•+]|(\d+[.)]))\s+(.*)$/);
    if (item) {
      flush();
      if (!inList) { html += '<ul class="md">'; inList = true; }
      const level = item[1].replace(/\t/g, "  ").length >= 2 ? 2 : 1;
      const body = (item[2] ? `${item[2]} ` : "") + item[3];
      html += `<li class="lvl${level}">${inline(esc(body))}</li>`;
      continue;
    }
    if (!raw.trim()) { flush(); continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const heading = raw.match(/^#{1,6}\s+(.*)$/);
    if (heading) { flush(); html += `<p class="md-h">${inline(esc(heading[1]))}</p>`; continue; }
    para.push(raw.trim());
  }
  flush();
  if (inList) html += "</ul>";
  return html;
}

function renderChat(pending = false) {
  const msgs = loadChat(current.id);
  $("messages").innerHTML = msgs.map((m, i) => m.role === "user"
    ? `<li class="msg-user">${esc(m.text)}</li>`
    : `<li class="msg-model${pending && i === msgs.length - 1 ? " pending" : ""}">${formatAnswer(m.text)}</li>`
  ).join("");
  $("suggest").hidden = msgs.length > 0;
}

async function ask(question) {
  const id = current.id;
  const msgs = loadChat(id);
  msgs.push({ role: "user", text: question });
  const answer = { role: "model", text: "" };
  msgs.push(answer);
  $("ask-go").disabled = true;
  $("ask-input").value = "";
  renderChat(true);

  try {
    const res = await fetch(`/api/videos/${encodeURIComponent(id)}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: msgs.slice(0, -1) }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Request failed (${res.status})`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      answer.text += decoder.decode(value, { stream: true });
      if (current && current.id === id) renderChat(true);
    }
    if (!answer.text.trim()) answer.text = "No answer came back. Try asking again.";
  } catch (err) {
    answer.text = `Couldn't get an answer: ${err.message}`;
  } finally {
    saveChat(id);
    $("ask-go").disabled = false;
    if (current && current.id === id) renderChat();
  }
}

$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("ask-input").value.trim();
  if (q && current) ask(q);
});

$("suggest").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && current && !$("ask-go").disabled) ask(b.textContent);
});

$("messages").addEventListener("click", (e) => {
  const b = e.target.closest("button.ts");
  if (b) { jump(Number(b.dataset.t)); seek(Number(b.dataset.t)); }
});

$("copy").addEventListener("click", async () => {
  const text = [`# ${current.title}`, current.source, "",
    ...current.entries.map((e) => `[${stamp(e.t)}] ${e.kind.padEnd(7)} ${e.text}`)].join("\n");
  await navigator.clipboard.writeText(text);
  $("copy").textContent = "Copied";
  setTimeout(() => ($("copy").textContent = "Copy timeline"), 1500);
});

const fromHash = location.hash.match(/v=([\w-]+)/);
if (fromHash) show(fromHash[1]).catch(() => { loadRecent(); loadSamples(); });
else { loadRecent(); loadSamples(); }
</script>
