[project]
name = "flipframe"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "aryannpanwarr", email = "aryannpanwarr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
flipframe = "flipframe:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
